name: Terraform infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a reviewable plan, or apply a previously reviewed plan
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      enable_custom_domain:
        description: Plan a public custom domain only after DNS and the first code release are ready
        type: boolean
        default: false
      plan_run_id:
        description: For apply, the successful plan run ID from this exact main commit
        type: string
      confirmation:
        description: For apply, enter APPLY after reviewing the selected plan
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: terraform-production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_state_bucket_name: ${{ vars.R2_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-init
      - name: Create and encrypt the reviewed plan
        env:
          TF_VAR_enable_custom_domain: ${{ inputs.enable_custom_domain }}
          PLAN_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_PASSPHRASE }}
        run: |
          test -n "$PLAN_PASSPHRASE"
          terraform -chdir=infra plan -input=false -lock-timeout=60s -out=reviewed.tfplan
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output infra/reviewed.tfplan.gpg \
            infra/reviewed.tfplan 3<<<"$PLAN_PASSPHRASE"
          echo "Review this run's Terraform plan log, then manually dispatch apply with run ID $GITHUB_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan-${{ github.run_id }}
          path: infra/reviewed.tfplan.gpg
          retention-days: 1
          if-no-files-found: error
      - name: Remove local plan files
        if: always()
        run: rm -f infra/reviewed.tfplan infra/reviewed.tfplan.gpg

  apply:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: terraform-production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_state_bucket_name: ${{ vars.R2_STATE_BUCKET }}
    steps:
      - name: Validate the selected main plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = APPLY
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" > "$RUNNER_TEMP/plan-run.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .path == ".github/workflows/terraform.yml" and
            .event == "workflow_dispatch" and .head_branch == "main" and
            .head_sha == $sha and .status == "completed" and .conclusion == "success"
          ' "$RUNNER_TEMP/plan-run.json" > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-init
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-plan-${{ inputs.plan_run_id }}
          path: infra
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: Back up the existing state privately in R2
        run: |
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          found=$(aws s3api list-objects-v2 --bucket "$R2_STATE_BUCKET" \
            --prefix production/terraform.tfstate --endpoint-url "$endpoint" \
            | jq -r '[.Contents[]? | select(.Key == "production/terraform.tfstate")] | length')
          if [ "$found" != 0 ]; then
            aws s3 cp "s3://$R2_STATE_BUCKET/production/terraform.tfstate" \
              "s3://$R2_STATE_BUCKET/backups/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tfstate" \
              --endpoint-url "$endpoint" --only-show-errors
          fi
      - name: Apply exactly the reviewed plan
        env:
          PLAN_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_PASSPHRASE }}
        run: |
          test -n "$PLAN_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output infra/reviewed.tfplan infra/reviewed.tfplan.gpg \
            3<<<"$PLAN_PASSPHRASE"
          terraform -chdir=infra apply -input=false -lock-timeout=60s reviewed.tfplan
      - name: Remove local plan files
        if: always()
        run: rm -f infra/reviewed.tfplan infra/reviewed.tfplan.gpg
