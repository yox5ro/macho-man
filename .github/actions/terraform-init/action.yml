name: Initialize Terraform R2 backend
description: Initialize credential-free backend configuration with credentials supplied by the caller environment
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: '1.15.6'
        terraform_wrapper: false
    - run: node scripts/prepare-backend.ts
      shell: bash
    - run: terraform -chdir=infra init -input=false -lockfile=readonly -backend-config=backend.tfbackend.json
      shell: bash
